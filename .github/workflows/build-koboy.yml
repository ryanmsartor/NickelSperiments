name: Build Ko Boy package

on:
  push:
  pull_request:
  workflow_call:
    inputs:
      release_tag:
        description: Tag to create or update; omit to build without releasing
        required: false
        type: string
  workflow_dispatch:
    inputs:
      release_tag:
        description: Tag to create or update
        required: true
        type: string

permissions:
  contents: read

jobs:
  koboy-package:
    name: Ko Boy KoboRoot package
    runs-on: ubuntu-latest
    container: ghcr.io/pgaskin/nickeltc:1.0
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Initialize Ko Boy dependencies
        run: git submodule update --init deps/armgba deps/armnes deps/NickelHook

      - name: Add NickelTC cross-toolchain to PATH
        run: echo "/tc/arm-nickel-linux-gnueabihf/bin" >> "$GITHUB_PATH"

      - name: Build Ko Boy KoboRoot package
        run: make koboy-package

      - name: Verify Ko Boy package checksum
        working-directory: build
        run: sha256sum -c Ko-Boy-KoboRoot.tgz.sha256

      - name: Upload Ko Boy KoboRoot package
        uses: actions/upload-artifact@v4
        with:
          name: Ko-Boy-KoboRoot
          path: |
            build/Ko-Boy-KoboRoot.tgz
            build/Ko-Boy-KoboRoot.tgz.sha256
          if-no-files-found: error

  release:
    name: Upload Ko Boy package to release
    if: inputs.release_tag != ''
    needs: koboy-package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Ko Boy package
        uses: actions/download-artifact@v4
        with:
          name: Ko-Boy-KoboRoot

      - name: Create release if needed
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$RELEASE_TAG" --notes "To install a package, rename its .tgz archive to exactly KoboRoot.tgz, copy it to the hidden .kobo folder at the root of your Kobo USB storage, and safely eject the Kobo." ||
              gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          fi

      - name: Upload Ko Boy package to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh release upload "$RELEASE_TAG" Ko-Boy-KoboRoot.tgz Ko-Boy-KoboRoot.tgz.sha256 --repo "$GITHUB_REPOSITORY" --clobber
