name: Build Gambatte Kobo prototypes

on:
  push:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gambatte-prototypes:
    name: Gambatte ARMv7 prototypes
    runs-on: ubuntu-latest
    container: ghcr.io/pgaskin/nickeltc:1.0
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Initialize Gambatte source
        run: git submodule update --init deps/gambatte

      - name: Add NickelTC cross-toolchain to PATH
        run: echo "/tc/arm-nickel-linux-gnueabihf/bin" >> "$GITHUB_PATH"

      - name: Build Gambatte prototypes
        run: make gambatte-bench gambatte-display-test

      - name: Verify ARMv7 outputs
        run: |
          file build/kobo-gambatte-bench | grep -q 'ELF 32-bit.*ARM'
          file build/kobo-gambatte-display-test | grep -q 'ELF 32-bit.*ARM'

      - name: Upload Gambatte prototypes
        uses: actions/upload-artifact@v4
        with:
          name: Gambatte-Kobo-Prototypes
          path: |
            build/kobo-gambatte-bench
            build/kobo-gambatte-display-test
          if-no-files-found: error
