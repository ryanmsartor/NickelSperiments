name: Build EWDB USB debugging package

on:
  push:
  pull_request:
  workflow_call:
    inputs:
      release_tag:
        description: Tag to create or update; omit to build without releasing
        required: false
        type: string
  workflow_dispatch:
    inputs:
      release_tag:
        description: Tag to create or update
        required: true
        type: string

permissions:
  contents: read

jobs:
  ewdb-package:
    name: EWDB ARMv7 binary and KoboRoot package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Go 1.26
        uses: actions/setup-go@v6
        with:
          go-version: 1.26.11
          check-latest: false

      - name: Build pinned EWDB and KoboRoot package
        run: make ewdb-package

      - name: Upload EWDB KoboRoot package
        uses: actions/upload-artifact@v4
        with:
          name: EWDB-KoboRoot
          path: build/EWDB-KoboRoot.tgz
          if-no-files-found: error

  release:
    name: Upload EWDB package to release
    if: inputs.release_tag != ''
    needs: ewdb-package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download EWDB package
        uses: actions/download-artifact@v4
        with:
          name: EWDB-KoboRoot

      - name: Create release if needed
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$RELEASE_TAG" --notes "To install a package, rename NickelRefresh-KoboRoot.tgz or EWDB-KoboRoot.tgz to KoboRoot.tgz, copy it to the root of your Kobo USB storage, and safely eject the Kobo." ||
              gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          fi

      - name: Upload EWDB package to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: gh release upload "$RELEASE_TAG" EWDB-KoboRoot.tgz --repo "$GITHUB_REPOSITORY" --clobber
