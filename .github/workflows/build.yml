name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/pgaskin/nickeltc:1.0
    steps:
      - uses: actions/checkout@v4
      - name: Add NickelTC toolchain to PATH
        run: echo "/tc/arm-nickel-linux-gnueabihf/bin" >> "$GITHUB_PATH"
      - name: Build KoboRoot package
        run: |
          git submodule update --init
          make clean all koboroot
      - uses: actions/upload-artifact@v4
        with:
          name: KoboRoot
          path: KoboRoot.tgz
