[device]
name = kobo
model = Kobo eReader
device = kobo
state = /run/ewdb/state
usb = ffs:/dev/usb-ffs/adb
serial_file = /run/ewdb/serial
shell = /bin/sh

[props]
ro.product.manufacturer = Kobo
ro.build.version.release = 4
ro.build.version.sdk = 0

[commands]
getprop = /usr/local/ewdb/ewdbd getprop
logcat = /usr/local/ewdb/ewdbd logcat
screencap = /usr/local/ewdb/ewdbd screencap
bugreportz = /usr/local/ewdb/ewdbd bugreportz
